# reload config
unbind r
bind r source-file ~/.tmux.conf

# terminal capabilities (server options)
set -s default-terminal "tmux-256color"
set -sa terminal-features ",*:RGB"        # true color
set -sa terminal-features ",*:hyperlinks"
set -sa terminal-features ",*:extkeys"

# keep escape delay low, while still allowing split escape sequences to parse
set -s escape-time 10

# allow neovim FocusGained/FocusLost events
set -s focus-events on

# enable extended keys (Ctrl+Shift+... combos); wezterm speaks the kitty
# keyboard protocol, so hand apps CSI u instead of xterm modifyOtherKeys
set -s extended-keys on
set -s extended-keys-format csi-u

# pass through (images, OSC sequences)
set -g allow-passthrough on

# forward pane titles (e.g. nvim's 'title') to the outer terminal
set -g set-titles on
set -g set-titles-string "#T"

# enable vim mode
setw -g mode-keys vi

# clear scrollback (prefix + C-l to avoid stealing C-l from neovim)
bind C-l send-keys -R \; clear-history

set -g status-position top

# start windows from 1
set -g base-index 1

# renumber windows after deleting one
set -g renumber-windows on

# set leader
set -g prefix C-s

# enable mouse
set -g mouse on

# scrollback size
set -g history-limit 50000

# copy and paste (exit copy-mode after mouse-drag selection)
set -g @yank_action 'copy-pipe-and-cancel'

# vim like pane nav
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# join panes
bind-key J choose-tree -Zw "join-pane -h -t '%%'"

# pane width resize (prefix + 9 / prefix + 0), repeatable
bind-key -r 9 resize-pane -L 2
bind-key -r 0 resize-pane -R 2

# workmux
bind w display-menu -x C -y C -T "workmux" \
    "add" a "popup -d '#{pane_current_path}' -w 80% -h 20% -x C -y C -E 'workmux-add-branch'" \
    "open" o "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E 'workmux-fzf open'" \
    "remove" r "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E 'workmux-fzf remove'" \
    "close" c "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E 'workmux-fzf close'" \
    "dashboard" d "popup -d '#{pane_current_path}' -w 90% -h 90% -x C -y C -E 'workmux dashboard'" \
    "sidebar" s "run-shell 'workmux sidebar'" \
    "quit" q ""

# session picker
# (first tab-separated field is the raw name, hidden from the list, so names
#  with spaces work in the preview and the final switch; preview shows session
#  info, a window/pane tree with the active pane marked, and the live screen)
bind p display-popup -w 85% -h 65% -x C -y C -E "\
  sel=\$(tmux list-sessions -F '#{session_last_attached}|#{session_name}|#{session_windows}|#{session_path}' |\
  sort -rn |\
  awk -F'|' -v home=\"\$HOME\" -v cur=\"\$(tmux display-message -p '#{session_name}')\" \
      '\$2 != cur { p=\$4; sub(home, \"~\", p); printf \"%s\\t%-24s %3s win  %s\\n\", \$2, \$2, \$3, p }' |\
  fzf --reverse --ansi --delimiter='\\t' --with-nth=2.. \
      --header='[Switch Session]' \
      --preview='s={1}; g=\$(printf \"\\033[1;32m\"); d=\$(printf \"\\033[2m\"); r=\$(printf \"\\033[0m\"); b=\$(printf \"\\033[1;33m\"); \
        last=\$(tmux display-message -p -t \"=\$s:\" \"#{session_last_attached}\"); ago=\$(( (\$(date +%s) - last) / 60 )); \
        if [ \"\$last\" -eq 0 ]; then ago=\"never attached\"; elif [ \"\$ago\" -ge 1440 ]; then ago=\"\$((ago / 1440))d ago\"; \
        elif [ \"\$ago\" -ge 60 ]; then ago=\"\$((ago / 60))h ago\"; else ago=\"\${ago}m ago\"; fi; \
        tmux display-message -p -t \"=\$s:\" \"\$b #{session_name}\$r  #{session_windows} win · #{?session_attached,attached,detached} · \$ago · \$d#{s|\$HOME|~|:session_path}\$r\"; echo; \
        tree=\$(tmux list-panes -s -t \"=\$s:\" -F \"#{?pane_active,#{?window_active,\$g,\$r},\$d} #{p14:#{=14:#{?#{&&:#{pane_at_top},#{pane_at_left}},#{window_index}:#{window_name}#{?window_zoomed_flag, [Z],},}}} #{?pane_active,▶,·} #{window_index}.#{pane_index}  #{p9:#{=9:pane_current_command}} #{s|\$HOME|~|:pane_current_path}\$r\"); \
        echo \"\$tree\"; n=\$(echo \"\$tree\" | wc -l); echo; echo \"\$d── screen ──\$r\"; \
        scr=\$(tmux capture-pane -e -p -t \"=\$s:\"); nb=\$(echo \"\$scr\" | grep -n \"[^[:space:]]\" | tail -1 | cut -d: -f1); \
        echo \"\$scr\" | head -n \"\${nb:-0}\" | tail -n \$(( FZF_PREVIEW_LINES - n - 5 > 5 ? FZF_PREVIEW_LINES - n - 5 : 5 ))' \
      --preview-window=right:45%:nowrap |\
  cut -f1); \
  [ -z \"\$sel\" ] && exit 0; \
  tmux switch-client -t \"=\$sel\""


# file picker: insert paths (from git root) into the pane, @-prefixed for AI tools
bind @ display-popup -d '#{pane_current_path}' -w 85% -h 65% -x C -y C -E "\
  cd \"\$(git rev-parse --show-toplevel 2>/dev/null || pwd)\" || exit 0; \
  if pgrep -P \"\$(tmux display-message -p '#{pane_pid}')\" -f 'opencode|claude|codex' >/dev/null; \
    then quote='s/ /\\\\ /g; s/^/@/'; else quote=\"s/.*/'&'/\"; fi; \
  out=\$(fd --type f --hidden --follow --exclude .git |\
    fzf --multi --reverse --header='[Insert Files]' \
        --preview='bat --style=numbers --color=always {}' \
        --preview-window=right:55% |\
    sed \"\$quote\" | tr '\\n' ' '); \
  [ -z \"\$out\" ] && exit 0; \
  tmux send-keys -l \"\$out\""

# new session from a zoxide directory, named after it (overrides find-window)
bind f display-popup -w 85% -h 65% -x C -y C -E "\
  dir=\$(zoxide query -l | fzf --reverse --header='[New Session]'); \
  [ -z \"\$dir\" ] && exit 0; \
  name=\$(basename \"\$dir\" | tr '.: ' '---'); \
  tmux new-session -d -s \"\$name\" -c \"\$dir\" 2>/dev/null; \
  tmux switch-client -t \"\$name\""

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

# theme
color_fg="#f5f5f5"
color_fg_accent="#ffcfa8"
color_fg_green="#6ad0b7"
color_bg="#161616"
color_bg_light="#242525"
color_border="#282828"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right ""
set -g status-style "fg=${color_fg},bg=default"
set -g @status_zoom "#{?window_zoomed_flag,#[bg=${color_fg_accent} fg=black bold] ZOOM #[default],}"
set -g status-left "#[fg=${color_fg_accent},bold,bg=${color_bg}] [󰇥 #S] "
set -g status-right "#[bg=${color_bg}] #{T:@status_zoom}  #h "

# bell: monitor background windows, auto-clear on focus
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

set -g window-status-bell-style ""
set -g window-status-current-format "#[bg=${color_bg},fg=${color_fg_green}] #I:#W "
set -g window-status-format "#[bg=${color_bg}] #I:#W#{?window_bell_flag, #[fg=red]●#[default],} "
set -g message-style "fg=${color_fg},bg=default"
set -g mode-style "fg=${color_fg_accent},bg=${color_bg_light}"
set -g pane-border-style "fg=${color_border}"
set -g pane-active-border-style "fg=${color_fg_green}"
set -g window-status-separator ''

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
